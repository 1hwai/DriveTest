name: Physics Diagnostics

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool libltdl-dev

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure
        run: |
          set -o pipefail
          cmake
          -S .
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DDRIVETEST_BUILD_PHYSICS_DIAGNOSTICS=ON
          2>&1 | tee configure.log

      - name: Build physics diagnostics
        run: cmake --build build --target DriveTestPhysicsDiagnostics -j2 2>&1 | tee build.log

      - name: Run physics diagnostics
        working-directory: build
        run: |
          ./DriveTestPhysicsDiagnostics > run.log 2>&1
          cat Logs/physics_diagnostics.log
          test -s Logs/physics_diagnostics.log

      - name: Upload physics logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: physics-diagnostics
          path: |
            configure.log
            build.log
            build/run.log
            build/Logs/physics_diagnostics.log
          if-no-files-found: warn
