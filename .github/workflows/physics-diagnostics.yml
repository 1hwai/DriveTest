name: Physics Diagnostics

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool libltdl-dev

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure
        run: |
          set -o pipefail
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DDRIVETEST_BUILD_PHYSICS_DIAGNOSTICS=ON \
            -DDRIVETEST_BUILD_VEHICLE_DIAGNOSTICS=ON \
            2>&1 | tee configure.log

      - name: Build diagnostics
        run: |
          set -o pipefail
          cmake --build build --target DriveTestPhysicsDiagnostics DriveTestVehicleDiagnostics -j2 2>&1 | tee build.log

      - name: Run diagnostics
        working-directory: build
        run: |
          set +e

          ./DriveTestPhysicsDiagnostics > physics_run.log 2>&1
          physics_status=$?

          ./DriveTestVehicleDiagnostics > vehicle_run.log 2>&1
          vehicle_status=$?

          {
            echo "===== PhysicsDiagnostics ====="
            cat physics_run.log
            cat Logs/physics_diagnostics.log
            echo "===== VehicleDiagnostics ====="
            cat vehicle_run.log
            cat Logs/vehicle_diagnostics.log
          } | tee run.log

          test -s Logs/physics_diagnostics.log
          physics_log_status=$?

          test -s Logs/vehicle_diagnostics.log
          vehicle_log_status=$?

          if [ "$physics_status" -ne 0 ] ||
             [ "$vehicle_status" -ne 0 ] ||
             [ "$physics_log_status" -ne 0 ] ||
             [ "$vehicle_log_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload physics logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: physics-diagnostics
          path: |
            configure.log
            build.log
            build/run.log
            build/Logs/physics_diagnostics.log
            build/Logs/vehicle_diagnostics.log
          if-no-files-found: warn
