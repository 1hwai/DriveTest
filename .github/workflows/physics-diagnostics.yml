name: Physics Diagnostics

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          set -o pipefail
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDRIVETEST_BUILD_APP=OFF \
            -DDRIVETEST_BUILD_PHYSICS_DIAGNOSTICS=ON \
            -DDRIVETEST_BUILD_VEHICLE_DIAGNOSTICS=ON \
            2>&1 | tee configure.log

      - name: Build diagnostics
        run: |
          set -o pipefail
          cmake --build build --target DriveTestPhysicsDiagnostics DriveTestVehicleDiagnostics -j2 2>&1 | tee build.log

      - name: Run diagnostics
        working-directory: build
        run: |
          set +e

          ./DriveTestPhysicsDiagnostics > physics_run.log 2>&1
          physics_status=$?

          ./DriveTestVehicleDiagnostics > vehicle_run.log 2>&1
          vehicle_status=$?

          echo "PhysicsDiagnostics exit code: $physics_status"
          echo "VehicleDiagnostics exit code: $vehicle_status"
          echo "===== PhysicsDiagnostics stdout ====="
          cat physics_run.log
          echo "===== PhysicsDiagnostics file log ====="
          if [ -f Logs/physics_diagnostics.log ]; then
            cat Logs/physics_diagnostics.log
          else
            echo "Missing expected log: Logs/physics_diagnostics.log"
          fi
          echo "===== VehicleDiagnostics stdout ====="
          cat vehicle_run.log
          echo "===== VehicleDiagnostics file log ====="
          if [ -f Logs/vehicle_diagnostics.log ]; then
            cat Logs/vehicle_diagnostics.log
          else
            echo "Missing expected log: Logs/vehicle_diagnostics.log"
          fi

          {
            echo "PhysicsDiagnostics exit code: $physics_status"
            echo "VehicleDiagnostics exit code: $vehicle_status"
            echo "===== PhysicsDiagnostics stdout ====="
            cat physics_run.log
            echo "===== VehicleDiagnostics stdout ====="
            cat vehicle_run.log
          } | tee run.log

          test -s Logs/physics_diagnostics.log
          physics_log_status=$?

          test -s Logs/vehicle_diagnostics.log
          vehicle_log_status=$?

          echo "PhysicsDiagnostics log check: $physics_log_status"
          echo "VehicleDiagnostics log check: $vehicle_log_status"

          if [ "$physics_status" -ne 0 ] ||
             [ "$vehicle_status" -ne 0 ] ||
             [ "$physics_log_status" -ne 0 ] ||
             [ "$vehicle_log_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload physics logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: physics-diagnostics
          path: |
            configure.log
            build.log
            build/run.log
            build/Logs/physics_diagnostics.log
            build/Logs/vehicle_diagnostics.log
          if-no-files-found: warn
